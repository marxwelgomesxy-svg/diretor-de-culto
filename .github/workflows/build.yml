name: Build Diretor de Culto - OBS 27.2.4

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build native plugin for OBS 27.2.4 - Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Download OBS 27.2.4 source
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\obs-source"
          git clone --depth 1 --branch 27.2.4 https://github.com/obsproject/obs-studio.git $root
          "OBS_SOURCE_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download OBS 27.2.4 Windows runtime
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\obs.zip"
          $dest = "$env:RUNNER_TEMP\obs-runtime"

          Invoke-WebRequest `
            -Uri "https://github.com/obsproject/obs-studio/releases/download/27.2.4/OBS-Studio-27.2.4-Full-x64.zip" `
            -OutFile $zip

          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dest -Force

          $exe = Get-ChildItem $dest -Recurse -Filter obs64.exe |
            Select-Object -First 1

          if (-not $exe) {
            throw "obs64.exe não encontrado."
          }

          "OBS_BIN_DIR=$($exe.Directory.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download Qt5 dependencies
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\qt5.zip"
          $dest = "$env:RUNNER_TEMP\qt5"

          Invoke-WebRequest `
            -Uri "https://github.com/obsproject/obs-deps/releases/download/2022-08-02/windows-deps-qt5-2022-08-02-x64.zip" `
            -OutFile $zip

          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dest -Force

          $qmake = Get-ChildItem $dest -Recurse -Filter qmake.exe |
            Select-Object -First 1

          if (-not $qmake) {
            throw "qmake.exe não encontrado."
          }

          $qtRoot = $qmake.Directory.Parent.FullName

          "CMAKE_PREFIX_PATH=$qtRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Append

            - name: Generate OBS import libraries
        shell: pwsh
        run: |
          $imp = "$env:RUNNER_TEMP\imports"

          New-Item -ItemType Directory -Force -Path $imp | Out-Null

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe não encontrado."
          }

          $vsPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vsPath) {
            throw "Visual Studio com ferramentas C++ não encontrado."
          }

          $dumpbin = Get-ChildItem `
            "$vsPath\VC\Tools\MSVC" `
            -Recurse `
            -Filter dumpbin.exe |
            Where-Object { $_.FullName -like "*Hostx64*x64*" } |
            Select-Object -First 1

          $libexe = Get-ChildItem `
            "$vsPath\VC\Tools\MSVC" `
            -Recurse `
            -Filter lib.exe |
            Where-Object { $_.FullName -like "*Hostx64*x64*" } |
            Select-Object -First 1

          if (-not $dumpbin) {
            throw "dumpbin.exe não encontrado."
          }

          if (-not $libexe) {
            throw "lib.exe não encontrado."
          }

          Write-Host "dumpbin: $($dumpbin.FullName)"
          Write-Host "lib: $($libexe.FullName)"

          foreach ($name in @("obs", "obs-frontend-api")) {

            $dll = Join-Path $env:OBS_BIN_DIR "$name.dll"

            if (-not (Test-Path $dll)) {
              throw "DLL não encontrada: $dll"
            }

            $def = Join-Path $imp "$name.def"

            "LIBRARY $name" | Out-File $def -Encoding ascii
            "EXPORTS" | Out-File $def -Append -Encoding ascii

            $exports = & $dumpbin.FullName /exports $dll

            foreach ($line in $exports) {
              if ($line -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+([^\s]+)\s*$') {

                $symbol = $Matches[1]

                if ($symbol -and $symbol -notmatch '^\?') {
                  $symbol | Out-File $def -Append -Encoding ascii
                }
              }
            }

            $lib = Join-Path $imp "$name.lib"

            & $libexe.FullName `
              /nologo `
              /machine:x64 `
              "/def:$def" `
              "/out:$lib"

            if ($LASTEXITCODE -ne 0) {
              throw "Falha criando $name.lib"
            }
          }

          "OBS_IMPORT_DIR=$imp" |
            Out-File -FilePath $env:GITHUB_ENV -Append
        shell: pwsh
        run: |
          $imp = "$env:RUNNER_TEMP\imports"

          New-Item -ItemType Directory -Force -Path $imp | Out-Null

          foreach ($name in @("obs", "obs-frontend-api")) {

            $dll = Join-Path $env:OBS_BIN_DIR "$name.dll"

            if (-not (Test-Path $dll)) {
              throw "DLL não encontrada: $dll"
            }

            $def = Join-Path $imp "$name.def"

            "LIBRARY $name" | Out-File $def -Encoding ascii
            "EXPORTS" | Out-File $def -Append -Encoding ascii

            $exports = & dumpbin /exports $dll

            foreach ($line in $exports) {
              if ($line -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+([^\s]+)\s*$') {

                $symbol = $Matches[1]

                if ($symbol -and $symbol -notmatch '^\?') {
                  $symbol | Out-File $def -Append -Encoding ascii
                }
              }
            }

            $lib = Join-Path $imp "$name.lib"

            & lib /nologo /machine:x64 /def:$def /out:$lib

            if ($LASTEXITCODE -ne 0) {
              throw "Falha criando $name.lib"
            }
          }

          "OBS_IMPORT_DIR=$imp" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_PREFIX_PATH="$env:CMAKE_PREFIX_PATH" `
            -DOBS_SOURCE_DIR="$env:OBS_SOURCE_DIR" `
            -DOBS_BIN_DIR="$env:OBS_IMPORT_DIR"

      - name: Build plugin
        shell: pwsh
        run: |
          cmake --build build `
            --config RelWithDebInfo `
            --parallel

      - name: Package plugin
        shell: pwsh
        run: |
          cmake --install build `
            --config RelWithDebInfo `
            --prefix package

          Compress-Archive `
            -Path package\* `
            -DestinationPath "Diretor-de-Culto-OBS27.2.4-Windows-x64.zip" `
            -Force

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Diretor-de-Culto-OBS27.2.4-Windows-x64
          path: Diretor-de-Culto-OBS27.2.4-Windows-x64.zip
          if-no-files-found: error
