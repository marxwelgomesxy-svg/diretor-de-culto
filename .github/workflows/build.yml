name: Build Diretor de Culto

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build native OBS plugin for Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout official OBS plugin template
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-plugintemplate
          path: .obs-plugin-template
          fetch-depth: 1

      - name: Import official OBS build infrastructure
        shell: pwsh
        run: |
          Copy-Item ".obs-plugin-template/cmake" "./cmake" -Recurse -Force
          Copy-Item ".obs-plugin-template/build-aux" "./build-aux" -Recurse -Force
          Copy-Item ".obs-plugin-template/CMakePresets.json" "./CMakePresets.json" -Force

          New-Item -ItemType Directory -Force ".github/actions" | Out-Null
          New-Item -ItemType Directory -Force ".github/scripts" | Out-Null

          Copy-Item ".obs-plugin-template/.github/actions/*" ".github/actions" -Recurse -Force
          Copy-Item ".obs-plugin-template/.github/scripts/*" ".github/scripts" -Recurse -Force

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset windows-x64 -DENABLE_FRONTEND_API=ON -DENABLE_QT=ON

      - name: Build
        shell: pwsh
        run: |
          cmake --build build_x64 --config RelWithDebInfo --parallel

      - name: Install plugin files
        shell: pwsh
        run: |
          Remove-Item "package" -Recurse -Force -ErrorAction SilentlyContinue
          cmake --install build_x64 --config RelWithDebInfo --prefix package

      - name: Create download ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "artifact" | Out-Null
          Copy-Item "package/RelWithDebInfo/*" "artifact" -Recurse -Force
          Compress-Archive -Path "artifact/*" -DestinationPath "Diretor-de-Culto-2.0.0-alpha-Windows-x64.zip" -Force

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diretor-de-Culto-2.0.0-alpha-Windows-x64
          path: Diretor-de-Culto-2.0.0-alpha-Windows-x64.zip
          if-no-files-found: error
