name: Build Diretor de Culto - OBS 27.2.4

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build native plugin for OBS 27.2.4 - Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Download OBS Studio 27.2.4 source
        shell: pwsh
        run: |
          git clone --depth 1 --branch 27.2.4 https://github.com/obsproject/obs-studio.git obs-source

      - name: Download OBS 27.2.4 Qt5 dependencies
        shell: pwsh
        run: |
          $qtZip = "$env:RUNNER_TEMP\obs-deps-qt5.zip"
          $qtExtract = "$env:RUNNER_TEMP\obs-deps-qt5"

          Write-Host "=========================================="
          Write-Host "BAIXANDO QT5 PARA OBS 27.2.4"
          Write-Host "=========================================="

          Invoke-WebRequest `
            -Uri "https://github.com/obsproject/obs-deps/releases/download/2022-08-02/windows-deps-qt5-2022-08-02-x64.zip" `
            -OutFile $qtZip

          if (-not (Test-Path $qtZip)) {
            throw "Download do pacote Qt5 falhou."
          }

          Write-Host "ZIP baixado:"
          Get-Item $qtZip | Select-Object FullName, Length

          if (Test-Path $qtExtract) {
            Remove-Item $qtExtract -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $qtExtract | Out-Null

          Expand-Archive `
            -Path $qtZip `
            -DestinationPath $qtExtract `
            -Force

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "PROCURANDO Qt5Config.cmake"
          Write-Host "=========================================="

          $qtConfig = Get-ChildItem `
            -Path $qtExtract `
            -Filter "Qt5Config.cmake" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $qtConfig) {
            Write-Host ""
            Write-Host "Qt5Config.cmake não encontrado."
            Write-Host "Estrutura do pacote:"
            
            Get-ChildItem `
              -Path $qtExtract `
              -Recurse `
              -Depth 5 |
              Select-Object FullName

            throw "Qt5Config.cmake não foi localizado no pacote Qt5."
          }

          Write-Host "Qt5Config.cmake encontrado:"
          Write-Host $qtConfig.FullName

          #
          # Exemplo esperado:
          #
          # .../lib/cmake/Qt5/Qt5Config.cmake
          #
          # Então o prefixo Qt será:
          #
          # .../
          #

          $qtCmakeDir = $qtConfig.Directory.FullName
          $qtCmakeParent = Split-Path $qtCmakeDir -Parent
          $qtLibDir = Split-Path $qtCmakeParent -Parent
          $qtPrefix = Split-Path $qtLibDir -Parent

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "QT5 DETECTADO"
          Write-Host "=========================================="
          Write-Host "Qt5 config : $qtCmakeDir"
          Write-Host "Qt5 lib    : $qtLibDir"
          Write-Host "Qt5 prefix : $qtPrefix"

          if (-not (Test-Path (Join-Path $qtPrefix "lib"))) {
            Write-Host "Aviso: prefixo não possui lib diretamente."
            Write-Host "Usando diretório pai do Qt5Config.cmake."

            $qtPrefix = Split-Path $qtLibDir -Parent
          }

          "QT_PREFIX=$qtPrefix" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host ""
          Write-Host "QT_PREFIX configurado como:"
          Write-Host "$qtPrefix"

      - name: Locate Visual Studio tools
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe não encontrado."
          }

          $vsPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vsPath) {
            throw "Visual Studio com ferramentas C++ não encontrado."
          }

          $dumpbin = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Filter dumpbin.exe -Recurse |
            Select-Object -First 1

          $libexe = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Filter lib.exe -Recurse |
            Select-Object -First 1

          if (-not $dumpbin) {
            throw "dumpbin.exe não encontrado."
          }

          if (-not $libexe) {
            throw "lib.exe não encontrado."
          }

          "DUMPBIN=$($dumpbin.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIBEXE=$($libexe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "dumpbin: $($dumpbin.FullName)"
          Write-Host "lib.exe: $($libexe.FullName)"

      - name: Generate OBS import libraries
        shell: pwsh
        run: |
          $obsBin = Join-Path $env:RUNNER_TEMP "obs-import-libs"

          New-Item -ItemType Directory -Force -Path $obsBin | Out-Null

          $obsDll = Get-ChildItem $env:OBS_RUNTIME_DIR -Filter "obs.dll" -Recurse |
            Select-Object -First 1

          $frontendDll = Get-ChildItem $env:OBS_RUNTIME_DIR -Filter "obs-frontend-api.dll" -Recurse |
            Select-Object -First 1

          if (-not $obsDll) {
            throw "obs.dll não encontrado no runtime do OBS 27.2.4."
          }

          if (-not $frontendDll) {
            throw "obs-frontend-api.dll não encontrado no runtime do OBS 27.2.4."
          }

          Write-Host "obs.dll: $($obsDll.FullName)"
          Write-Host "obs-frontend-api.dll: $($frontendDll.FullName)"

          $obsDef = Join-Path $obsBin "obs.def"
          $frontendDef = Join-Path $obsBin "obs-frontend-api.def"

          & $env:DUMPBIN /exports $obsDll.FullName |
            Out-File -Encoding ascii $obsDef

          & $env:DUMPBIN /exports $frontendDll.FullName |
            Out-File -Encoding ascii $frontendDef

          function Convert-DumpbinToDef {
            param(
              [string]$DumpbinText,
              [string]$DllName,
              [string]$OutputFile
            )

            $lines = $DumpbinText -split "`r?`n"
            $exports = New-Object System.Collections.Generic.List[string]
            $started = $false

            foreach ($line in $lines) {
              if ($line -match "ordinal hint RVA name") {
                $started = $true
                continue
              }

              if (-not $started) {
                continue
              }

              if ($line -match "^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(.+?)\s*$") {
                $name = $matches[1].Trim()

                if ($name -and
                    $name -notmatch "^__IMPORT_DESCRIPTOR" -and
                    $name -notmatch "^__NULL_IMPORT_DESCRIPTOR" -and
                    $name -notmatch "^NULL_THUNK_DATA") {
                  $exports.Add($name)
                }
              }
            }

            if ($exports.Count -eq 0) {
              throw "Nenhuma exportação encontrada para $DllName."
            }

            $content = New-Object System.Collections.Generic.List[string]
            $content.Add("LIBRARY $DllName")
            $content.Add("EXPORTS")

            foreach ($name in $exports) {
              $content.Add("    $name")
            }

            Set-Content -Path $OutputFile -Value $content -Encoding ascii
          }

          $obsDump = & $env:DUMPBIN /exports $obsDll.FullName | Out-String
          $frontendDump = & $env:DUMPBIN /exports $frontendDll.FullName | Out-String

          Convert-DumpbinToDef `
            -DumpbinText $obsDump `
            -DllName "obs.dll" `
            -OutputFile $obsDef

          Convert-DumpbinToDef `
            -DumpbinText $frontendDump `
            -DllName "obs-frontend-api.dll" `
            -OutputFile $frontendDef

          & $env:LIBEXE /DEF:$obsDef /MACHINE:X64 /OUT:(Join-Path $obsBin "obs.lib")
          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao gerar obs.lib"
          }

          & $env:LIBEXE /DEF:$frontendDef /MACHINE:X64 /OUT:(Join-Path $obsBin "obs-frontend-api.lib")
          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao gerar obs-frontend-api.lib"
          }

          Write-Host "Bibliotecas geradas:"
          Get-ChildItem $obsBin | Select-Object Name, Length, FullName

          "OBS_IMPORT_DIR=$obsBin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure CMake
        shell: pwsh
        run: |
          Write-Host "OBS_SOURCE_DIR=$env:GITHUB_WORKSPACE\obs-source"
          Write-Host "OBS_BIN_DIR=$env:OBS_IMPORT_DIR"
          Write-Host "QT_PREFIX=$env:QT_PREFIX"

          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_PREFIX" `
            -DOBS_SOURCE_DIR="$env:GITHUB_WORKSPACE\obs-source" `
            -DOBS_BIN_DIR="$env:OBS_IMPORT_DIR"

      - name: Build plugin
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "VERIFICANDO BIBLIOTECAS OBS"
          Write-Host "=========================================="

          Write-Host "OBS_IMPORT_DIR:"
          Write-Host "$env:OBS_IMPORT_DIR"

          Get-ChildItem "$env:OBS_IMPORT_DIR" -Force |
            Select-Object Name, Length, FullName

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "LINKER VERBOSE"
          Write-Host "=========================================="

          cmake --build build `
            --config RelWithDebInfo `
            --parallel `
            --verbose

      - name: Install package
        shell: pwsh
        run: |
          cmake --install build `
            --config RelWithDebInfo `
            --prefix "$env:GITHUB_WORKSPACE\package"

      - name: Copy plugin runtime dependencies
        shell: pwsh
        run: |
          $pluginDir = Join-Path "$env:GITHUB_WORKSPACE\package" "obs-plugins\64bit"

          New-Item -ItemType Directory -Force -Path $pluginDir | Out-Null

          Write-Host "Arquivos instalados:"
          Get-ChildItem "$env:GITHUB_WORKSPACE\package" -Recurse |
            Select-Object FullName

      - name: Package ZIP
        shell: pwsh
        run: |
          $zip = "$env:GITHUB_WORKSPACE\Diretor-de-Culto-OBS27.2.4-Windows-x64.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "$env:GITHUB_WORKSPACE\package\*" `
            -DestinationPath $zip `
            -Force

          Write-Host "ZIP criado:"
          Get-Item $zip | Select-Object FullName, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diretor-de-Culto-OBS27.2.4-Windows-x64
          path: Diretor-de-Culto-OBS27.2.4-Windows-x64.zip
          if-no-files-found: error
