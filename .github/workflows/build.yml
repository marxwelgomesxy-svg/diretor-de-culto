name: Build Diretor de Culto - OBS 27.2.4

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build native plugin for OBS 27.2.4 - Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Download OBS 27.2.4 source
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\obs-source"
          git clone --depth 1 --branch 27.2.4 https://github.com/obsproject/obs-studio.git $root
          if (-not (Test-Path "$root\CMakeLists.txt")) { throw "Fonte do OBS 27.2.4 não foi baixada corretamente." }
          "OBS_SOURCE_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download OBS 27.2.4 Windows runtime
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\obs.zip"
          $dest = "$env:RUNNER_TEMP\obs-runtime"

          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          Invoke-WebRequest `
            -Uri "https://github.com/obsproject/obs-studio/releases/download/27.2.4/OBS-Studio-27.2.4-Full-x64.zip" `
            -OutFile $zip

          Expand-Archive -Path $zip -DestinationPath $dest -Force

          $obsDll = Get-ChildItem $dest -Recurse -Filter obs.dll | Select-Object -First 1
          if (-not $obsDll) { throw "obs.dll não encontrado no runtime do OBS 27.2.4." }

          $runtimeDir = $obsDll.Directory.FullName
          $frontendDll = Join-Path $runtimeDir "obs-frontend-api.dll"

          if (-not (Test-Path $frontendDll)) {
            throw "obs-frontend-api.dll não encontrado em: $runtimeDir"
          }

          Write-Host "OBS_RUNTIME_DIR: $runtimeDir"
          Write-Host "obs.dll: $obsDll"
          Write-Host "obs-frontend-api.dll: $frontendDll"

          "OBS_RUNTIME_DIR=$runtimeDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download Qt5 dependencies
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\qt5.zip"
          $dest = "$env:RUNNER_TEMP\qt5"
          Invoke-WebRequest -Uri "https://github.com/obsproject/obs-deps/releases/download/2022-08-02/windows-deps-qt5-2022-08-02-x64.zip" -OutFile $zip
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $qmake = Get-ChildItem $dest -Recurse -Filter qmake.exe | Select-Object -First 1
          if (-not $qmake) { throw "qmake.exe não encontrado nas dependências Qt5." }
          $qtRoot = $qmake.Directory.Parent.FullName
          Write-Host "Qt5: $qtRoot"
          "CMAKE_PREFIX_PATH=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Locate Visual Studio x64 tools
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe não encontrado." }

          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Visual Studio com ferramentas C++ não encontrado." }

          $msvcRoot = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $msvcRoot) { throw "MSVC não encontrado." }

          $x64Tools = Join-Path $msvcRoot.FullName "bin\HostX64\x64"
          $dumpbin = Join-Path $x64Tools "dumpbin.exe"
          $libexe = Join-Path $x64Tools "lib.exe"

          if (-not (Test-Path $dumpbin)) { throw "dumpbin x64 não encontrado: $dumpbin" }
          if (-not (Test-Path $libexe)) { throw "lib.exe x64 não encontrado: $libexe" }

          Write-Host "Visual Studio: $vsPath"
          Write-Host "DUMPBIN: $dumpbin"
          Write-Host "LIBEXE: $libexe"

          "DUMPBIN=$dumpbin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIBEXE=$libexe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Generate OBS import libraries
        shell: pwsh
        run: |
          $obsBin = Join-Path $env:RUNNER_TEMP "obs-import-libs"

          if (Test-Path $obsBin) {
            Remove-Item $obsBin -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $obsBin | Out-Null

          $obsDll = Join-Path $env:OBS_RUNTIME_DIR "obs.dll"
          $frontendDll = Join-Path $env:OBS_RUNTIME_DIR "obs-frontend-api.dll"

          if (-not (Test-Path $obsDll)) { throw "obs.dll não encontrado em: $obsDll" }
          if (-not (Test-Path $frontendDll)) { throw "obs-frontend-api.dll não encontrado em: $frontendDll" }

          function Get-ExportNames {
            param([string]$DllPath)

            Write-Host ""
            Write-Host "=========================================="
            Write-Host "DUMPBIN: $DllPath"
            Write-Host "=========================================="

            $rawOutput = & $env:DUMPBIN /exports "$DllPath" 2>&1 | Out-String
            $exitCode = $LASTEXITCODE

            if ($exitCode -ne 0) {
              Write-Host $rawOutput
              throw "dumpbin falhou para $DllPath com código $exitCode."
            }

            Write-Host $rawOutput

            $lines = $rawOutput -split "`r?`n"
            $exports = New-Object System.Collections.Generic.List[string]
            $started = $false

            foreach ($line in $lines) {
              $trimmed = $line.Trim()

              if ($trimmed -match '^ordinal\s+hint\s+RVA\s+name') {
                $started = $true
                continue
              }

              if (-not $started -or [string]::IsNullOrWhiteSpace($trimmed)) { continue }
              if ($trimmed -match '^-+$') { continue }

              if ($trimmed -match '^\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(.+?)\s*$') {
                $name = $matches[1].Trim()

                if ($name -match '^([^\s=]+)\s*=\s*(.+)$') {
                  $name = $matches[1].Trim()
                }

                if ($name -and $name -notmatch '^__IMPORT_DESCRIPTOR' -and $name -notmatch '^__NULL_IMPORT_DESCRIPTOR' -and $name -notmatch '^NULL_THUNK_DATA') {
                  $exports.Add($name)
                }
              }
            }

            $exports = @($exports | Where-Object { $_ } | Sort-Object -Unique)

            Write-Host ""
            Write-Host "EXPORTS ENCONTRADOS: $($exports.Count)"

            if ($exports.Count -eq 0) {
              throw "Nenhuma exportação encontrada para $DllPath."
            }

            $exports | Select-Object -First 20 | ForEach-Object { Write-Host "  $_" }
            if ($exports.Count -gt 20) { Write-Host "  ... e mais $($exports.Count - 20)" }

            return $exports
          }

          function Create-DefFile {
            param([string]$DllName, [string]$OutputFile, [object[]]$Exports)

            $content = New-Object System.Collections.Generic.List[string]
            $content.Add("LIBRARY `"$DllName`")
            $content.Add("EXPORTS")

            foreach ($name in $Exports) { $content.Add("    $name") }

            Set-Content -Path $OutputFile -Value $content -Encoding ascii
            if (-not (Test-Path $OutputFile)) { throw "Não foi possível criar $OutputFile." }
          }

          $obsExports = @(Get-ExportNames $obsDll)
          $obsDef = Join-Path $obsBin "obs.def"
          Create-DefFile -DllName "obs.dll" -OutputFile $obsDef -Exports $obsExports

          $frontendExports = @(Get-ExportNames $frontendDll)
          $frontendDef = Join-Path $obsBin "obs-frontend-api.def"
          Create-DefFile -DllName "obs-frontend-api.dll" -OutputFile $frontendDef -Exports $frontendExports

          $obsLib = Join-Path $obsBin "obs.lib"
          $frontendLib = Join-Path $obsBin "obs-frontend-api.lib"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "GERANDO obs.lib"
          Write-Host "=========================================="

          & $env:LIBEXE /DEF:"$obsDef" /MACHINE:X64 /OUT:"$obsLib"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao gerar obs.lib." }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "GERANDO obs-frontend-api.lib"
          Write-Host "=========================================="

          & $env:LIBEXE /DEF:"$frontendDef" /MACHINE:X64 /OUT:"$frontendLib"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao gerar obs-frontend-api.lib." }

          if (-not (Test-Path $obsLib)) { throw "obs.lib não foi criada." }
          if (-not (Test-Path $frontendLib)) { throw "obs-frontend-api.lib não foi criada." }

          Get-ChildItem $obsBin | Select-Object Name, Length, FullName

          "OBS_IMPORT_DIR=$obsBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "IMPORT LIBRARIES GERADAS COM SUCESSO"
          Write-Host "=========================================="

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_PREFIX_PATH="$env:CMAKE_PREFIX_PATH" `
            -DOBS_SOURCE_DIR="$env:OBS_SOURCE_DIR" `
            -DOBS_BIN_DIR="$env:OBS_IMPORT_DIR"

      - name: Build plugin
        shell: pwsh
        run: |
          cmake --build build `
            --config RelWithDebInfo `
            --parallel

      - name: Package plugin
        shell: pwsh
        run: |
          cmake --install build --config RelWithDebInfo --prefix package
          if (-not (Test-Path "package\obs-plugins\64bit\diretor-de-culto.dll")) {
            Write-Host "Conteúdo gerado:"
            Get-ChildItem package -Recurse | Select-Object FullName
            throw "diretor-de-culto.dll não foi encontrado no pacote."
          }
          Compress-Archive -Path package\* -DestinationPath "Diretor-de-Culto-OBS27.2.4-Windows-x64.zip" -Force

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Diretor-de-Culto-OBS27.2.4-Windows-x64
          path: Diretor-de-Culto-OBS27.2.4-Windows-x64.zip
          if-no-files-found: error
