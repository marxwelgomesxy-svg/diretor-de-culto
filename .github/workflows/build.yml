name: Build Diretor de Culto - OBS 27.2.4

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build native plugin for OBS 27.2.4 - Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Download OBS Studio 27.2.4 source
        shell: pwsh
        run: |
          if (Test-Path "$env:GITHUB_WORKSPACE\obs-source") {
            Remove-Item "$env:GITHUB_WORKSPACE\obs-source" -Recurse -Force
          }

          git clone --depth 1 --branch 27.2.4 `
            https://github.com/obsproject/obs-studio.git `
            "$env:GITHUB_WORKSPACE\obs-source"

          if (-not (Test-Path "$env:GITHUB_WORKSPACE\obs-source\CMakeLists.txt")) {
            throw "Código-fonte do OBS 27.2.4 não foi baixado corretamente."
          }

      - name: Download OBS Studio 27.2.4 runtime
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\obs-runtime.zip"
          $extract = "$env:RUNNER_TEMP\obs-runtime"

          Invoke-WebRequest `
            -Uri "https://github.com/obsproject/obs-studio/releases/download/27.2.4/OBS-Studio-27.2.4-Full-x64.zip" `
            -OutFile $zip

          if (-not (Test-Path $zip)) {
            throw "Download do OBS 27.2.4 falhou."
          }

          if (Test-Path $extract) {
            Remove-Item $extract -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $extract | Out-Null

          Expand-Archive -Path $zip -DestinationPath $extract -Force

          $obsDll = Get-ChildItem `
            -Path $extract `
            -Filter "obs.dll" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\bin\\64bit\\obs\.dll$" } |
            Select-Object -First 1

          if (-not $obsDll) {
            $obsDll = Get-ChildItem `
              -Path $extract `
              -Filter "obs.dll" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if (-not $obsDll) {
            Write-Host "Estrutura extraída:"
            Get-ChildItem $extract -Recurse -Depth 6 | Select-Object FullName
            throw "obs.dll não encontrado no pacote OBS 27.2.4."
          }

          $obsRuntimeDir = $obsDll.Directory.FullName
          $frontendDll = Join-Path $obsRuntimeDir "obs-frontend-api.dll"

          if (-not (Test-Path $frontendDll)) {
            $frontendDll = Get-ChildItem `
              -Path $extract `
              -Filter "obs-frontend-api.dll" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "\\bin\\64bit\\obs-frontend-api\.dll$" } |
              Select-Object -First 1
          }

          if (-not $frontendDll) {
            throw "obs-frontend-api.dll não encontrado no runtime do OBS 27.2.4."
          }

          if ($frontendDll -is [System.IO.FileInfo]) {
            $frontendDllPath = $frontendDll.FullName
          } else {
            $frontendDllPath = $frontendDll
          }

          Write-Host "obs.dll: $($obsDll.FullName)"
          Write-Host "obs-frontend-api.dll: $frontendDllPath"
          Write-Host "OBS_RUNTIME_DIR: $obsRuntimeDir"

          "OBS_RUNTIME_DIR=$obsRuntimeDir" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download OBS 27.2.4 Qt5 dependencies
        shell: pwsh
        run: |
          $qtZip = "$env:RUNNER_TEMP\obs-deps-qt5.zip"
          $qtExtract = "$env:RUNNER_TEMP\obs-deps-qt5"

          Invoke-WebRequest `
            -Uri "https://github.com/obsproject/obs-deps/releases/download/2022-08-02/windows-deps-qt5-2022-08-02-x64.zip" `
            -OutFile $qtZip

          if (-not (Test-Path $qtZip)) {
            throw "Download do pacote Qt5 falhou."
          }

          if (Test-Path $qtExtract) {
            Remove-Item $qtExtract -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $qtExtract | Out-Null

          Expand-Archive -Path $qtZip -DestinationPath $qtExtract -Force

          $qtConfig = Get-ChildItem `
            -Path $qtExtract `
            -Filter "Qt5Config.cmake" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $qtConfig) {
            Write-Host "Qt5Config.cmake não encontrado."
            Get-ChildItem $qtExtract -Recurse -Depth 6 | Select-Object FullName
            throw "Qt5Config.cmake não foi localizado no pacote Qt5."
          }

          $qtCmakeDir = $qtConfig.Directory.FullName

          $qtPrefixCandidates = @(
            (Split-Path (Split-Path (Split-Path $qtCmakeDir -Parent) -Parent) -Parent),
            (Split-Path (Split-Path $qtCmakeDir -Parent) -Parent),
            (Split-Path $qtCmakeDir -Parent)
          )

          $qtPrefix = $null

          foreach ($candidate in $qtPrefixCandidates) {
            if ($candidate -and
                (Test-Path (Join-Path $candidate "lib")) -and
                (Test-Path (Join-Path $candidate "include"))) {
              $qtPrefix = $candidate
              break
            }
          }

          if (-not $qtPrefix) {
            $qtPrefix = Split-Path $qtCmakeDir -Parent
          }

          Write-Host "Qt5Config.cmake: $($qtConfig.FullName)"
          Write-Host "QT_PREFIX: $qtPrefix"

          "QT_PREFIX=$qtPrefix" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Locate Visual Studio x64 tools
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe não encontrado."
          }

          $vsPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vsPath) {
            throw "Visual Studio com ferramentas C++ não encontrado."
          }

          $dumpbin = Get-ChildItem `
            "$vsPath\VC\Tools\MSVC" `
            -Filter "dumpbin.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\HostX64\\x64\\dumpbin\.exe$" } |
            Select-Object -First 1

          $libexe = Get-ChildItem `
            "$vsPath\VC\Tools\MSVC" `
            -Filter "lib.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\HostX64\\x64\\lib\.exe$" } |
            Select-Object -First 1

          if (-not $dumpbin) {
            throw "dumpbin.exe x64 não encontrado."
          }

          if (-not $libexe) {
            throw "lib.exe x64 não encontrado."
          }

          Write-Host "dumpbin: $($dumpbin.FullName)"
          Write-Host "lib.exe : $($libexe.FullName)"

          "DUMPBIN=$($dumpbin.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          "LIBEXE=$($libexe.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Generate OBS import libraries
        shell: pwsh
        run: |
          $obsBin = Join-Path $env:RUNNER_TEMP "obs-import-libs"

          if (Test-Path $obsBin) {
            Remove-Item $obsBin -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $obsBin | Out-Null

          $obsDll = Join-Path $env:OBS_RUNTIME_DIR "obs.dll"
          $frontendDll = Join-Path $env:OBS_RUNTIME_DIR "obs-frontend-api.dll"

          if (-not (Test-Path $obsDll)) {
            throw "obs.dll não encontrado em: $obsDll"
          }

          if (-not (Test-Path $frontendDll)) {
            throw "obs-frontend-api.dll não encontrado em: $frontendDll"
          }

          function Convert-DumpbinToDef {
            param(
              [string]$DumpbinText,
              [string]$DllName,
              [string]$OutputFile
            )

            $lines = $DumpbinText -split "`r?`n"
            $exports = New-Object System.Collections.Generic.List[string]
            $started = $false

            foreach ($line in $lines) {
              if ($line -match "ordinal hint RVA name") {
                $started = $true
                continue
              }

              if (-not $started) {
                continue
              }

              if ($line -match "^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(.+?)\s*$") {
                $name = $matches[1].Trim()

                if ($name -and
                    $name -notmatch "^__IMPORT_DESCRIPTOR" -and
                    $name -notmatch "^__NULL_IMPORT_DESCRIPTOR" -and
                    $name -notmatch "^NULL_THUNK_DATA") {
                  $exports.Add($name)
                }
              }
            }

            if ($exports.Count -eq 0) {
              throw "Nenhuma exportação encontrada para $DllName."
            }

            $content = New-Object System.Collections.Generic.List[string]
            $content.Add("LIBRARY $DllName")
            $content.Add("EXPORTS")

            foreach ($name in $exports) {
              $content.Add("    $name")
            }

            Set-Content -Path $OutputFile -Value $content -Encoding ascii
          }

          $obsDump = & $env:DUMPBIN /exports $obsDll 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "dumpbin falhou ao analisar obs.dll."
          }

          $frontendDump = & $env:DUMPBIN /exports $frontendDll 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "dumpbin falhou ao analisar obs-frontend-api.dll."
          }

          $obsDef = Join-Path $obsBin "obs.def"
          $frontendDef = Join-Path $obsBin "obs-frontend-api.def"

          Convert-DumpbinToDef -DumpbinText $obsDump -DllName "obs.dll" -OutputFile $obsDef
          Convert-DumpbinToDef -DumpbinText $frontendDump -DllName "obs-frontend-api.dll" -OutputFile $frontendDef

          $obsLib = Join-Path $obsBin "obs.lib"
          $frontendLib = Join-Path $obsBin "obs-frontend-api.lib"

          & $env:LIBEXE /DEF:$obsDef /MACHINE:X64 /OUT:$obsLib
          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao gerar obs.lib"
          }

          & $env:LIBEXE /DEF:$frontendDef /MACHINE:X64 /OUT:$frontendLib
          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao gerar obs-frontend-api.lib"
          }

          Write-Host "Bibliotecas geradas:"
          Get-ChildItem $obsBin | Select-Object Name, Length, FullName

          "OBS_IMPORT_DIR=$obsBin" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify OBS import libraries
        shell: pwsh
        run: |
          $obsLib = Join-Path $env:OBS_IMPORT_DIR "obs.lib"
          $frontendLib = Join-Path $env:OBS_IMPORT_DIR "obs-frontend-api.lib"

          if (-not (Test-Path $obsLib)) {
            throw "obs.lib não foi criada."
          }

          if (-not (Test-Path $frontendLib)) {
            throw "obs-frontend-api.lib não foi criada."
          }

          Get-Item $obsLib | Select-Object FullName, Length
          Get-Item $frontendLib | Select-Object FullName, Length

      - name: Configure CMake
        shell: pwsh
        run: |
          if (Test-Path "build") {
            Remove-Item "build" -Recurse -Force
          }

          cmake `
            -S . `
            -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_PREFIX" `
            -DOBS_SOURCE_DIR="$env:GITHUB_WORKSPACE\obs-source" `
            -DOBS_BIN_DIR="$env:OBS_IMPORT_DIR"

          if ($LASTEXITCODE -ne 0) {
            throw "Configuração do CMake falhou."
          }

      - name: Build plugin
        shell: pwsh
        run: |
          Write-Host "OBS_IMPORT_DIR:"
          Write-Host "$env:OBS_IMPORT_DIR"

          Get-ChildItem "$env:OBS_IMPORT_DIR" -Force |
            Select-Object Name, Length, FullName

          cmake --build build `
            --config RelWithDebInfo `
            --parallel `
            --verbose

          if ($LASTEXITCODE -ne 0) {
            throw "Build do plugin falhou."
          }

      - name: Install package
        shell: pwsh
        run: |
          if (Test-Path "$env:GITHUB_WORKSPACE\package") {
            Remove-Item "$env:GITHUB_WORKSPACE\package" -Recurse -Force
          }

          cmake --install build `
            --config RelWithDebInfo `
            --prefix "$env:GITHUB_WORKSPACE\package"

          if ($LASTEXITCODE -ne 0) {
            throw "cmake --install falhou."
          }

          Get-ChildItem "$env:GITHUB_WORKSPACE\package" -Recurse |
            Select-Object FullName

      - name: Verify plugin package
        shell: pwsh
        run: |
          $plugin = Get-ChildItem `
            "$env:GITHUB_WORKSPACE\package" `
            -Filter "diretor-de-culto.dll" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $plugin) {
            Get-ChildItem "$env:GITHUB_WORKSPACE\package" -Recurse |
              Select-Object FullName

            throw "diretor-de-culto.dll não encontrado no pacote final."
          }

          Write-Host "Plugin encontrado:"
          Write-Host $plugin.FullName

      - name: Package ZIP
        shell: pwsh
        run: |
          $zip = "$env:GITHUB_WORKSPACE\Diretor-de-Culto-OBS27.2.4-Windows-x64.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "$env:GITHUB_WORKSPACE\package\*" `
            -DestinationPath $zip `
            -Force

          if (-not (Test-Path $zip)) {
            throw "ZIP final não foi criado."
          }

          Get-Item $zip | Select-Object FullName, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diretor-de-Culto-OBS27.2.4-Windows-x64
          path: Diretor-de-Culto-OBS27.2.4-Windows-x64.zip
          if-no-files-found: error
